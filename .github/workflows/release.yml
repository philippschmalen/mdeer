name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: gh release create "$env:GITHUB_REF_NAME" target/release/mdeer.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
