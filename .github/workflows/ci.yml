name: ci
on:
  push:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1
      - uses: EmbarkStudios/cargo-deny-action@v2
      # THIRD_PARTY_LICENSES.md must match Cargo.lock; regenerate with the same command.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md && git diff --exit-code THIRD_PARTY_LICENSES.md
