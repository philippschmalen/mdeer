[package]
description = "Lightweight markdown reader and editor"
license = "MIT OR Apache-2.0"
name = "mdeer"
version = "0.4.3"
edition = "2024"
repository = "https://github.com/philippschmalen/mdeer"
homepage = "https://github.com/philippschmalen/mdeer"
readme = "README.md"
keywords = ["markdown", "editor", "viewer", "notepad", "egui"]
categories = ["text-editors", "gui"]
include = ["/src", "/assets", "/build.rs", "/LICENSE-*", "/THIRD_PARTY_LICENSES.md", "/README.md"]

[dependencies]
diffy = { version = "0.5.2", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links", "clipboard", "wayland", "x11", "accesskit"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "better_syntax_highlighting"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
interprocess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"

[target."cfg(windows)".dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# dev only: EFRAME_SCREENSHOT_TO=out.png cargo run -F screenshot -- file.md
screenshot = ["eframe/__screenshot"]


# ponytail: fork until lampsitter/egui_commonmark ships the table-in-list fix; drop this then.
# crates.io ignores [patch], so `cargo install mdeer` still has the bug until upstream releases.
[patch.crates-io]
egui_commonmark = { git = "https://github.com/philippschmalen/egui_commonmark", rev = "dcace24e59000220227175e1d12fda3ecac7d556" }
egui_commonmark_backend = { git = "https://github.com/philippschmalen/egui_commonmark", rev = "dcace24e59000220227175e1d12fda3ecac7d556" }
