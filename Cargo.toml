[package]
description = "Lightweight markdown reader and editor"
license = "MIT"
name = "mdeer"
version = "0.3.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links", "clipboard", "wayland", "x11", "accesskit"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "better_syntax_highlighting"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
interprocess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# dev only: EFRAME_SCREENSHOT_TO=out.png cargo run -F screenshot -- file.md
screenshot = ["eframe/__screenshot"]
